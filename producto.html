<!DOCTYPE html>
<html lang="es">
<head>

  <title>DarleXPC | Detalle del producto</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS global -->
  <link rel="stylesheet" href="./css/product.css">

</head>
<body>
